name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Threads Pocket Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Java 17 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 自動配置 Android 專案與相依修復
        run: |
          # 1. 確保 lib/main.dart 放置正確
          mkdir -p lib
          if [ -f "main.dart" ]; then
            cp -f main.dart lib/main.dart
          fi

          # 2. 自動生成乾淨標準的 Android 專案結構（確保 Gradle 與 AGP 完全相容）
          flutter create --platforms=android --org app.threads_pocket --project-name threads_pocket .

          # 3. 確保 minSdkVersion 設為 21（sqflite 與現代 Android 核心庫必備）
          find android/ -name "build.gradle*" -exec sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' {} +
          find android/ -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdk/minSdk = 21/g' {} +
          find android/ -name "build.gradle*" -exec sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 21/g' {} +

          # 4. 在 AndroidManifest.xml 注入網路存取權限
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: 下載安裝相依套件
        run: flutter pub get

      - name: 編譯 Android Release APK
        run: flutter build apk --release

      - name: 上傳 APK 安裝檔供下載
        uses: actions/upload-artifact@v4
        with:
          name: Threads-Pocket-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
